; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:portenta_h7_m7]
platform = ststm32
board = portenta_h7_m7
framework = arduino
build_unflags =
	-std=gnu++11
	-std=gnu++14
build_flags =
	-std=gnu++14
	-D CORE_CM7
	-D ARDUINO_PORTENTA_H7_M7
	-D BUILD_VERSION="\"MVP-1.0\""
	-D BOARD_HAS_WIFI
	-D BOARD_HAS_SECRET_KEY
	-Uabs
	-I include
; Build full firmware (not MVP-only)
; If you want to limit compilation during experiments, reintroduce build_src_filter.
; Force stubs to be found before library internals
lib_ldf_mode = chain+
lib_compat_mode = off
; GSM_Stub and Arduino_Cellular_Stub in lib/ folder provide stub headers
lib_deps =
	; Arduino Cloud - MVP only needs these
	arduino-libraries/ArduinoIoTCloud
	arduino-libraries/Arduino_ConnectionHandler
	bblanchon/ArduinoJson @ ^6.21.3
	knolleary/PubSubClient @ ^2.8
	arduino-libraries/NTPClient @ ^3.2.1
	arduino-libraries/Arduino_UnifiedStorage @ ^1.1.0
	https://github.com/arduino-libraries/arduino_portentamachinecontrol.git
lib_ignore =
	; Ignore incompatible libraries
	WiFiNINA
	WiFi101
	MKRGSM
	MKRNB
	NB
	MKRWAN
	; Ignore framework's GSM library - we provide our own stub in lib/GSM_Stub
	GSM
test_ignore = native/*
monitor_speed = 115200
monitor_filters =
	colorize
	time
upload_protocol = dfu
extra_scripts =
	pre:scripts/pre_build.py
	post:scripts/post_build.py

[env:portenta_h7_m7_remote]
extends = env:portenta_h7_m7
upload_protocol = custom
upload_command = python scripts/remote_upload.py $SOURCE $UPLOAD_PORT
; Set default IP, user can override with: pio run -t upload -e portenta_h7_m7_remote --upload-port 192.168.1.100
upload_port = 192.168.1.100

[env:native]
platform = native
test_framework = unity
test_filter = native/*
build_flags =
    -std=c++14
    -D UNIT_TEST
    -I test/native/mocks/
    -I include/
    -I include/Core
    -I include/Hardware
    -I include/IO
    -I include/Network
    -I include/Services
    -I src/
build_src_filter = 
    +<Core/ConfigManager.cpp> 
    +<Core/SystemDiagnostics.cpp>
    +<Network/MQTTManager.cpp>
    +<Network/NetworkManager.cpp>
    +<Network/NetworkSettings.cpp>
    +<../test/native/mocks/MockLogger.cpp>
    +<../test/native/mocks/Arduino.cpp>
    +<../test/native/mocks/WiFi.cpp>
    +<../test/native/mocks/IO/IoController.cpp>
    +<../test/native/mocks/Services/HomeAssistant/HomeAssistantDiscovery.cpp>
    +<../test/native/mocks/PortentaEthernet.cpp>
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3
test_build_src = yes
